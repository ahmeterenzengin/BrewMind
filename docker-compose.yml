version: '3.8'
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: coffee_rag_db
    environment:
      POSTGRES_DB: coffee_rag
      POSTGRES_USER: coffee_user
      POSTGRES_PASSWORD: coffee_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee_user -d coffee_rag"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
